<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Analytics{% endblock %} · MusicLib</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    <script defer src="{{ url_for('static', filename='js/tables.js') }}"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <div class="brand">
          <a href="{{ url_for('analytics.index') }}">MusicLib Analytics</a>
        </div>
        <nav class="nav">
          <a href="{{ url_for('analytics.index') }}">Overview</a>
          <a href="{{ url_for('analytics.songs') }}">Songs</a>
          <a href="{{ url_for('analytics.albums') }}">Albums</a>
        </nav>
      </div>
    </header>

    <main class="container">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
